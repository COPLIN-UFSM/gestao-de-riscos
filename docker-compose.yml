services:
  web:
    build: .
    container_name: gestao-de-riscos
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: src.gestao_risco.settings.production
      FORCE_SCRIPT_NAME: /gestao-de-riscos
    volumes:
      - staticfiles:/home/staticfiles
    ports:
      - "127.0.0.1:8005:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./src/frontend
      args:
        VITE_BASE_PATH: /gestao-de-riscos/
    container_name: gestao-de-riscos-frontend
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  staticfiles:
