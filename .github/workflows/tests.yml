name: CI/CD

on:
  push:
    branches:
      - main
      - dev
      - feat/**
      - tests/**
      - refactor/**
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t gestao-de-riscos .

      - name: Run tests with in-memory SQLite
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=src.gestao_risco.settings.test \
            -e SECRET_KEY=ci-test-secret-key \
            gestao-de-riscos \
            python -m pytest

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: self-hosted

    steps:
      - name: Deploy on production server
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          if [ -z "$DEPLOY_PATH" ]; then
            echo "Configure the DEPLOY_PATH repository variable with the checkout path on the production server."
            exit 1
          fi

          cd "$DEPLOY_PATH"
          git pull --ff-only origin main
          docker compose build
          docker compose run --rm web python manage.py migrate --noinput
          docker compose run --rm web python manage.py collectstatic --noinput
          docker compose up -d
